# ==========================================
# BASE DE DATOS (MySQL - AWS RDS / Local)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:dilanmotos}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# THYMELEAF & SWAGGER
# ==========================================
spring.thymeleaf.cache=false
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# SERVICIOS DE TERCEROS (Google AI / Gemini / Groq)
# ==========================================
google.api.key=${GOOGLE_API_KEY}
google.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}

groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

deepseek.api.key=${DEEPSEEK_API_KEY:sk-tu-api-key-aqui}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.model.name=deepseek-v4-flash

# SEGURIDAD (JWT)
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# SERVICIO DE CORREO (SMTP Gmail)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true